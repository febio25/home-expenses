# Local test and Portainer installation.
#   docker compose up -d --build
# then open http://localhost:8080
#
# The Umbrel package lives in the separate store repository
# (umbrel-app-store/tallynest-expenses) and uses the published image.

# Fixed project name: the data volume keeps the name it had when this folder
# was called "spese-di-casa" (spese-di-casa_spese-data), so renaming or moving
# the folder does not "lose" the data.
name: spese-di-casa

services:
  spese:
    # Build from the source in this folder...
    build: .
    image: spese-di-casa:local
    # ...or, to skip the build (e.g. in Portainer), comment out the two lines
    # above and use the image published by GitHub Actions instead:
    # image: ghcr.io/febio25/home-expenses:0.7.0
    container_name: spese-di-casa
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # auto   = session cookie marked Secure only when the request is HTTPS.
      #          Right for tests over plain HTTP on localhost or the LAN.
      # true   = always Secure (default of the image; use it behind HTTPS).
      SPESE_COOKIE_SECURE: "auto"
    volumes:
      # Named volume: survives restarts, rebuilds and image updates.
      - spese-data:/data

volumes:
  spese-data:
